# Point ~/.claude at dotfiles/claude, as on the laptop, so config changes made
# on the box land in the repo. Runtime state stays out of git via
# claude/.gitignore.
- name: Link ~/.claude to the dotfiles
  become_user: "{{ box_user }}"
  block:
    - name: Check ~/.claude
      ansible.builtin.stat:
        path: "{{ box_home }}/.claude"
      register: claude_dir

    # A box set up before this role existed has a real ~/.claude holding the
    # login and session history: carry it over without overwriting tracked
    # files and keep the old directory as a backup.
    - name: Migrate an existing ~/.claude
      ansible.builtin.shell: |
        set -euo pipefail
        rsync -a --ignore-existing "$HOME/.claude/" "{{ box_dotfiles }}/claude/"
        mv "$HOME/.claude" "$HOME/.claude.pre-dotfiles-$(date +%Y%m%d%H%M%S)"
      args:
        executable: /bin/bash
      when: claude_dir.stat.isdir is defined and claude_dir.stat.isdir and not claude_dir.stat.islnk

    - name: Link ~/.claude
      ansible.builtin.file:
        src: "{{ box_home }}/.dotfiles/claude"
        dest: "{{ box_home }}/.claude"
        state: link

    # CLAUDE.md imports claude-environment.md; the laptop links claude-local.md.
    - name: Select the claude-box CLAUDE.md section
      ansible.builtin.file:
        src: claude-box.md
        dest: "{{ box_dotfiles }}/claude/claude-environment.md"
        state: link
        force: true

# After the ~/.claude link, so the installer's state lands in the repo's
# ignored files. Claude Code updates itself from here on.
- name: Install Claude Code
  become_user: "{{ box_user }}"
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
    creates: "{{ box_home }}/.local/bin/claude"

# Claude Code reads user-scoped MCP servers from ~/.claude.json, so register
# through the CLI. The laptop's claude/install registers a headed browser.
- name: Register the Playwright MCP
  become_user: "{{ box_user }}"
  environment:
    PATH: "{{ box_home }}/.local/bin:{{ ansible_env.PATH }}"
  block:
    - name: Read the Playwright MCP registration
      ansible.builtin.command: claude mcp get playwright
      register: playwright_mcp
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Register Playwright MCP with headless Chrome
      ansible.builtin.shell: |
        claude mcp remove --scope user playwright > /dev/null 2>&1 || true
        claude mcp add --scope user playwright -- npx {{ playwright_mcp_args }}
      when: "playwright_mcp.rc != 0 or ('Args: ' ~ playwright_mcp_args) not in playwright_mcp.stdout"
