# Managed by dotfiles/claude-box (hardening role)
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Nothing on the box should become a path to anywhere else.
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
# Counts keys offered, not passwords; clients with several keys need room.
MaxAuthTries 10
