# Managed by dotfiles/claude-box (hardening role)
# Every lookup goes to Quad9 over TLS, never to the DNS server DHCP hands out,
# which on a shared network can read and forge answers. `~.` routes all names
# here; Tailscale's more specific routing domains still win for the tailnet.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
Domains=~.
DNSOverTLS=yes
