# fnm installs Node per user and follows each project's .nvmrc or
# .node-version. The default version is linked into ~/.local/bin so
# non-interactive shells, Claude's tools and MCP servers find node and npx
# without fnm's shell hook.
- name: Install Node with fnm
  become_user: "{{ box_user }}"
  environment:
    FNM_DIR: "{{ box_home }}/.local/share/fnm"
  block:
    - name: Download fnm
      ansible.builtin.unarchive:
        src: https://github.com/Schniz/fnm/releases/latest/download/fnm-linux.zip
        dest: "{{ box_home }}/.local/bin"
        remote_src: true
        creates: "{{ box_home }}/.local/bin/fnm"
        mode: "0755"

    - name: Install the latest LTS Node
      ansible.builtin.command: "{{ box_home }}/.local/bin/fnm install --lts"
      register: fnm_install
      changed_when: "'already installed' not in fnm_install.stderr + fnm_install.stdout"

    - name: Make the LTS Node the default
      ansible.builtin.command: "{{ box_home }}/.local/bin/fnm default lts-latest"
      changed_when: false

    - name: Link the default Node into ~/.local/bin
      ansible.builtin.file:
        src: "{{ box_home }}/.local/share/fnm/aliases/default/bin/{{ item }}"
        dest: "{{ box_home }}/.local/bin/{{ item }}"
        state: link
        force: true
      loop: [node, npm, npx, corepack]

    # Interactive shells switch Node when entering a project directory.
    - name: Hook fnm into interactive bash
      ansible.builtin.blockinfile:
        path: "{{ box_home }}/.bashrc"
        marker: "# {mark} claude-box fnm"
        block: |
          export FNM_DIR="$HOME/.local/share/fnm"
          eval "$("$HOME/.local/bin/fnm" env --use-on-cd --shell bash)"
